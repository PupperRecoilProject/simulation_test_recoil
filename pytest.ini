[pytest]
# 測試基礎設定（T02-4）。詳見 docs/TEST_SOP.md。
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 排除「非單元測試」的工具/手動腳本（它們檔名雖以 test_ 開頭，但 import 期有副作用，
# 會在 pytest 收集階段炸掉整套）。詳見 docs/reports/AUDIT_2026-06-07.md T02-1。
addopts =
    --ignore=test/test_joystick.py
    --ignore=test/test_teensy_connection.py
    -ra

# 安靜化第三方噪音；保留我們自己的警告
filterwarnings =
    ignore::DeprecationWarning
