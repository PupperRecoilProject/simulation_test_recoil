      - 'linear_velocity'
      - 'angular_velocity'
      - 'gravity_vector'
      - 'joint_positions'
      - 'joint_velocities'
      - 'last_action'
      - 'commands_3d' 
  
  agile_model: 
    path: "models/pupper_ppo_policy_200540160_tf_converted.onnx"
    # 假設 agile_model 使用與 stable_walk 相同的配方
    observation_recipe:
      - 'linear_velocity'
      - 'angular_velocity'
      - 'gravity_vector'
      - 'joint_positions'
      - 'joint_velocities'
      - 'last_action'
      - 'commands_3d' 

