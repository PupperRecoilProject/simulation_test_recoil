# ==================================
# === 模擬與模型設定 (Simulation & Model Settings)
# ==================================
# 檔案路徑 (File Paths)
mujoco_model_file: "assets/scene_mjx.xml"
# config.yaml

# ==================================
# === 模擬與模型設定 (Simulation & Model Settings)
# ==================================
# ...
# onnx_model_path: "models/pupper_ppo_policy_30965760_tf_converted_穩定步態版.onnx" # 舊的單一模型路徑，可以先註解掉

# ONNX 模型庫 (ONNX Model Library)
onnx_models:
  stable_walk: 
    path: "models/pupper_ppo_policy_30965760_tf_converted_穩定步態版.onnx"
    # 【新】為每個模型指定觀察配方
    observation_recipe:
      - 'linear_velocity'
      - 'angular_velocity'
      - 'gravity_vector'
      - 'joint_positions'
      - 'joint_velocities'
      - 'last_action'
      - 'commands_3d' # 【修改】從 commands -> commands_3d
  
  agile_model: 
    path: "models/pupper_ppo_policy_200540160_tf_converted.onnx"
    # 假設 agile_model 使用與 stable_walk 相同的配方
    observation_recipe:
      - 'linear_velocity'
      - 'angular_velocity'
      - 'gravity_vector'
      - 'joint_positions'
      - 'joint_velocities'
      - 'last_action'
      - 'commands_3d' # 【修改】從 commands -> commands_3d

  new_high_level: 
    path: "models/pupper_ppo_policy_203161600_tf_v2.3_converted.onnx"
    # 【新】使用新的觀察配方
    observation_recipe:
      - 'angular_velocity'
      - 'gravity_vector'
      - 'accelerometer'
      - 'joint_positions'
      - 'joint_velocities'
      - 'last_action'
      - 'commands_3d' # 【修改】從 commands -> commands_3d

  new_e2e: 
    path: "models/pupper_ppo_policy_e2e_203161600.onnx"
    # e2e 模型也使用新的觀察配方
    observation_recipe:
      - 'angular_velocity'
      - 'gravity_vector'
      - 'accelerometer'
      - 'joint_positions'
      - 'joint_velocities'
      - 'last_action'
      - 'commands_3d' # 【修改】從 commands -> commands_3d

  fire_on_recoil_51: 
    path: "models/pupper_ppo_policy_e2e_101580800.onnx"
    # fire_on_recoil_51 模型也使用新的觀察配方
    observation_recipe:
      - 'angular_velocity'
      - 'gravity_vector'
      - 'accelerometer'
      - 'current_pitch'
      - 'joint_positions'
      - 'joint_velocities'
      - 'last_action'
      - 'commands_4d' # 【修改】從 commands -> commands_4d
      - 'firearm_recoil_warming'


# 模型平滑切換設定
policy_transition_duration: 0.5 # 平滑過渡的持續時間 (秒)
# ==================================

# 核心參數 (Core Parameters)
num_motors: 12
physics_timestep: 0.004 # <-- 建議修改：提高模擬精度以增強穩定性
# 【v4.11.0 核心修改】
# 這個參數現在是整個控制系統（模擬和硬體）運行的全局頻率 (Hz)。
# 將其從 50.0 降低到 5.0，即可讓 AI 決策和指令發送都以 5Hz 運行。
control_freq: 50.0 # 原為 50.0
warmup_duration: 0.0

# ONNX 模型命令輸入縮放因子
# 順序: [vy 縮放, vx 縮放, wz 縮放]
command_scaling_factors: [1.0, 1.0, 1.0, 1.0] 

# ==================================
# === 輸入控制設定 (Input Control Settings)
# ==================================
keyboard_velocity_adjust_step: 0.1 # m/s or rad/s per key press

gamepad_sensitivity:
  vx: 1.0   # 前後速度靈敏度 (左搖桿 Y)
  vy: 1.0   # 左右速度靈敏度 (左搖桿 X)
  wz: -1.5  # 轉向角速度靈敏度 (右搖桿 X), 負值表示右推右轉

param_adjust_steps:
  kp: 0.5
  kd: 0.05
  action_scale: 0.05
  bias: 5

# ==================================
# === 初始調校參數 (Initial Tuning Parameters)
# ==================================

# 【v4.11.2 新增】機器人的預設站立姿態 (12個關節的角度, 單位: 弧度)
# 這個值應與 MuJoCo XML 文件中的 'home' keyframe 保持一致。
# 這是計算標準化觀測 joint_positions 的基準。
default_pose: [
  0.0, 0.0, 0.0,  # Front-Right Leg (Abduction, Hip, Knee)
  0.0, 0.0, 0.0,  # Front-Left Leg
  0.0, 0.0, 0.0,  # Hind-Right Leg
  0.0, 0.0, 0.0   # Hind-Left Leg
]

initial_tuning_params:
  kp: 2.67  #8000/3000=2.6667
  kd: 0.17 #500/3000=0.1667
  action_scale: 0.5
  bias: -0.0

# ==================================
# === 級聯控制器設定 (Cascade Controller Settings)
# ==================================
cascade_controller:
  # 這些值應參考訓練腳本
  pos_kp: 16 # 外環位置 P 增益
  vel_kp: 500    # 內環速度 P 增益 (單位: N*m / (rad/s))
  max_target_velocity_rad_s: 8 # 最大目標速度 (rad/s)
  torque_limit: 1.6 # 最終輸出力矩的安全限制 (N*m)


# ==================================
# === 觀察配方 (Observation Recipes)
# ==================================
#observation_recipes:
#  31:
#    - 'z_angular_velocity'
#    - 'gravity_vector'
#    - 'commands'
#    - 'joint_positions'
#    - 'last_action'
#  48: # <-- 修改這個 48 維的順序
#    - 'linear_velocity'
#    - 'angular_velocity'
#    - 'gravity_vector'
#    - 'joint_positions'
#    - 'joint_velocities'
#    - 'last_action'
#    - 'commands' # <-- 將 commands 移動到最後

# ================================================================= #
# === 懸浮控制器設定 (Floating Controller Settings) - 精細調校版 ===
# ================================================================= #
floating_controller:
  target_height: 0.50     # 懸浮的目標高度 (米)
  kp_vertical: 80.0       # 垂直 P (再次降低以求平滑)
  kd_vertical: 18.0       # 垂直 D (保持與Kp的關係)
  kp_attitude: 20.0       # 姿態 P (再次降低)
  kd_attitude: 4.0        # 姿態 D (相應調整)

# 【v4.10.0 新增】地形生成設定
# ==================================
# === 地形生成設定 (Terrain Generation Settings)
# ==================================
terrain_generation:
  sine_waves_amplitude: 0.04  # 正弦波地形的最大高度 (原為 0.08) (預設 0.04)
  steps_height: 0.025         # 階梯地形的單階高度 (原為 0.05) (預設 0.025)
  random_noise_amplitude: 0.05 # 隨機噪點地形的最大高度 (原為 0.1) (預設 0.05)
  pyramid_max_height: 0.4      # 金字塔地形的最大高度 (原為 0.3-0.6) (預設 0.4)
  stepped_pyramid_max_height: 0.5 # 階梯金字塔的最大高度 (原為 0.4-0.8) (預設 0.5)
  stepped_pyramid_steps_min: 12 # 控制階梯金字塔的階梯數量範圍下限 (預設 12)
  stepped_pyramid_steps_max: 16 # 控制階梯金字塔的階梯數量範圍上限 (預設 16)

# ===================================================================
firearm_recoil_warming:
  auto_inhibit: true  #false   # true = 關閉自動預警，只保留手動 
